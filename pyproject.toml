[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ciphercontact"
version = "0.0.0"
description = "CipherContact: secure internal database DLP management and distribution for call campaigns"
requires-python = ">=3.12"

# Constrained ranges here; exact pins with hashes live in the generated lockfile
# (run scripts/lock.sh in an environment with PyPI access). No open lower bounds.
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
  "jinja2>=3.1,<3.2",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<1.15",
  "psycopg[binary]>=3.2,<3.3",
  "redis>=5.2,<6",
  "celery>=5.4,<5.5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2,<0.3",
  "pyotp>=2.9,<3",
  "python-multipart>=0.0.20,<0.1",
  "phonenumbers>=8.13,<9",
  "itsdangerous>=2.2,<3",
  "cryptography>=43,<46",
  "openpyxl>=3.1,<3.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<0.26",
  "hypothesis>=6.122,<7",
  "httpx>=0.28,<0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F pyflakes, I imports, B bugbear, UP pyupgrade, S bandit-security, ASYNC
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection system requires Depends(...) (and friends) as default
# argument values; they are evaluated once and are immutable, unlike the general
# mutable-default footgun B008 otherwise guards against. Standard FastAPI+ruff config.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.params.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.File",
  "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
# S101 asserts are the normal pytest idiom. S105/S108 flag fixed test credentials and
# paths as if they were production secrets; they are deliberate, known-fake test fixtures.
"tests/*" = ["S101", "S105", "S108"]

[tool.mypy]
# Pragmatic to start; tighten toward strict as the codebase settles.
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires a database and Redis",
]

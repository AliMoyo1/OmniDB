name: ciphercontact

# postgres, redis, web, worker, beat, caddy. No database or app ports are published to
# the host; only Caddy publishes 80/443 on the LAN. web and worker share the quarantine
# volume: web writes uploads there, the worker reads and parses them.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-ciphercontact}
      POSTGRES_USER: ${DB_USER:-ciphercontact}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ciphercontact} -d ${DB_NAME:-ciphercontact}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    env_file: [.env]
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    secrets:
      - db_password
      - app_secret_key
      - field_encryption_key
      - phone_fingerprint_hmac_key
    volumes:
      - quarantine:/var/lib/ciphercontact/quarantine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data
      - edge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file: [.env]
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    secrets:
      - db_password
      - app_secret_key
      - field_encryption_key
      - phone_fingerprint_hmac_key
    volumes:
      - quarantine:/var/lib/ciphercontact/quarantine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  beat:
    build: .
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    env_file: [.env]
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    secrets:
      - db_password
      - app_secret_key
      - field_encryption_key
      - phone_fingerprint_hmac_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      SERVER_HOST: ${SERVER_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
    networks:
      - edge
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  quarantine:

secrets:
  db_password:
    file: ./deploy/secrets/db_password
  app_secret_key:
    file: ./deploy/secrets/app_secret_key
  field_encryption_key:
    file: ./deploy/secrets/field_encryption_key
  phone_fingerprint_hmac_key:
    file: ./deploy/secrets/phone_fingerprint_hmac_key

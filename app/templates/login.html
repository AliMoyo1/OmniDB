{% extends "base.html" %}
{% block title %}Sign in - CipherContact{% endblock %}
{% block content %}
<section class="card login-card">
  <h2>Cipher<span class="brand-accent" style="color:var(--accent-mid)">Contact</span></h2>
  {% if flash_error %}
  <p class="flash error">{{ flash_error }}</p>
  {% endif %}
  <form method="post" action="/login">
    <label>Email
      <input type="email" name="email" value="{{ email or '' }}" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <label>Authenticator code (if enrolled)
      <input type="text" name="totp_code" inputmode="numeric" autocomplete="one-time-code">
    </label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
